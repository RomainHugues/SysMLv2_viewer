<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>

  <!-- edges -->
  <g stroke="#9fb3d1" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M128 92 L74 150"/>
    <path d="M128 92 L128 150"/>
    <path d="M128 92 L182 150"/>
  </g>

  <!-- root node (neutral) -->
  <g filter="url(#sh)">
    <rect x="98" y="52" width="60" height="40" rx="9" fill="#e8eef7" stroke="#9fb3d1" stroke-width="3"/>
  </g>

  <!-- leaf nodes: Arcadia colour code (green function / blue logical / yellow physical) -->
  <g filter="url(#sh)">
    <rect x="44" y="150" width="60" height="40" rx="9" fill="#c6e0b4" stroke="#548235" stroke-width="3"/>
    <rect x="98" y="150" width="60" height="40" rx="9" fill="#bdd7ee" stroke="#2e75b6" stroke-width="3"/>
    <rect x="152" y="150" width="60" height="40" rx="9" fill="#ffe699" stroke="#bf9000" stroke-width="3"/>
  </g>
</svg>
